
version: "3.8"

services:
  # -------------------------------------------------
  # InfluxDB 1.8 
  # -------------------------------------------------
  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    restart: unless-stopped
    ports:
      - '8086:8086'
    volumes:
      - influxdb_data:/var/lib/influxdb
    environment:
      - INFLUXDB_HTTP_AUTH_ENABLED=true
      - INFLUXDB_ADMIN_ENABLED=true
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=admin123
      # Add an environment variable to automatically create the database
      - INFLUXDB_DB=speedtest 
    healthcheck:
      test: ["CMD", "curl", "-f", "http://192.168.1.5:8086/ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # -------------------------------------------------
  # Speedtest to InfluxDB (Monitors performance)
  # -------------------------------------------------
  speedtest-to-influxdb:
    image: breadlysm/speedtest-to-influxdb
    container_name: speedtest-to-influxdb
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      - INFLUX_DB_ADDRESS=influxdb
      - INFLUX_DB_PORT=8086
      - INFLUX_DB_NAME=speedtest
      - INFLUX_DB_USER=admin
      - INFLUX_DB_PASSWORD=admin123
      - SPEEDTEST_INTERVAL=300
      - LOG_LEVEL=info
volumes:
  influxdb_data: {}
