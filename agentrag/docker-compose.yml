services:
  # -------------------------------------------------
  # Ollama – inference engine
  # -------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"               # ekspos ke host untuk debugging
    networks:
      - rag_network
    # (Opsional) Simpan model Ollama secara permanen
    # volumes:
    #   - /home/haqqi/rag/ollama_models:/root/.ollama

  # -------------------------------------------------
  # PostgreSQL + pgVector
  # -------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hibhaqqi
      POSTGRES_PASSWORD: rahahsia!
      POSTGRES_DB: rag_db
    ports:
      - "5436:5432"                 # host:5436 → container:5432
    volumes:
      - /home/haqqi/rag/pg_data:/var/lib/postgresql/data   # data DB persisten
    networks:
      - rag_network

  # -------------------------------------------------
  # Anything-LLM (UI + backend)
  # -------------------------------------------------
  anything:
    image: mintplexlabs/anythingllm:latest
    container_name: anything-llm
    restart: unless-stopped
    environment:
      STORAGE_DIR: /app/storage                 # wajib: menyimpan koleksi dan sesi
      OLLAMA_HOST: http://192.168.1.5:11434          # akses ke layanan Ollama
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: rag_db
      POSTGRES_USER: hibhaqqi         # mesti sama dengan POSTGRES_USER di service postgres
      POSTGRES_PASSWORD: rahahsia!    # mesti sama dengan POSTGRES_PASSWORD di service postgres
      UPLOADS_PATH: /app/storage/uploads
      DIRECT_UPLOADS_PATH: /app/storage/uploads
    ports:
      - "7022:3000"            # akses UI di http://localhost:7022
    depends_on:
      - ollama
      - postgres
    volumes:
      - /home/haqqi/rag/anything_storage:/app/storage   # folder persisten untuk Anything-LLM
    networks:
      - rag_network

# -------------------------------------------------
# Jaringan internal – komunikasi antar container tanpa expose publik
# -------------------------------------------------
networks:
  rag_network:
    driver: bridge

