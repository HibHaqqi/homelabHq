---
# Ansible Playbook: KosCek Billing Generation Cron Job
#
# This playbook is designed for Semaphore (or any Ansible setup with existing inventory).
# No external files required - all variables are passed via extra-vars.
#
# SEMAPHORE SETUP:
# 1. Upload this playbook to your Semaphore project
# 2. In Semaphore Task > Extra Variables, add:
#    - app_url: https://koscek.id
#    - vault_cron_secret: YOUR_CRON_SECRET (from .env)
#    - cron_minute: 0
#    - cron_hour: 8
#    - cron_user: www-data
#
# CLI USAGE (for testing):
#   ansible-playbook cron-billing.yml \
#     --extra-vars "app_url=https://koscek.id vault_cron_secret=YOUR_SECRET"

- name: Configure KosCek Billing Generation Cron Job
  hosts: all
  become: yes
  vars:
    # REQUIRED VARIABLES - Set these in Semaphore Extra Variables
    app_url: "{{ app_url | default('https://koscek.id') }}"
    vault_cron_secret: "{{ vault_cron_secret | default('AYtGuNumPfxhdjk0pJIgFH7V/FsD91g7K8wMX+Jbh8Q=') }}"

    # OPTIONAL VARIABLES - Override in Semaphore if needed
    cron_minute: "{{ cron_minute | default('0') }}"
    cron_hour: "{{ cron_hour | default('8') }}"
    cron_day: "{{ cron_day | default('*') }}"
    cron_month: "{{ cron_month | default('*') }}"
    cron_weekday: "{{ cron_weekday | default('*') }}"
    cron_user: "{{ cron_user | default('www-data') }}"
    cron_job_name: "{{ cron_job_name | default('koscek-billing') }}"

