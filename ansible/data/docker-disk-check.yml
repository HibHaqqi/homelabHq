# Ansible Playbook: Docker Disk Space Check & Optimization
# Usage: ansible-playbook -i inventory docker-disk-check.yml --ask-become-pass

- name: Docker Disk Space Check & Optimization
  hosts: all
  become: true
  gather_facts: true

  vars:
    disk_warning_threshold: 80
    disk_critical_threshold: 90
    docker_image_age_days: 30

  tasks:
    # ============================================
    # System Disk Space Check (Using Native Facts)
    # ============================================
    - name: Calculate root filesystem usage
      ansible.builtin.set_fact:
        root_usage_percent: "{{ ((item.size_total - item.size_available) / item.size_total * 100) | round(1) }}"
      loop: "{{ ansible_mounts }}"
      when: item.mount == "/"

    - name: Display disk usage
      ansible.builtin.debug:
        msg: "Root filesystem usage is currently {{ root_usage_percent }}%"

    - name: Alert if disk usage is high
      ansible.builtin.debug:
        msg: |
          ⚠️  WARNING: Root filesystem usage is {{ root_usage_percent }}%
          Threshold: {{ disk_warning_threshold }}%
      when: root_usage_percent | float >= disk_warning_threshold

    # ============================================
    # Docker System Information
    # ============================================
    - name: Check if Docker is installed and running
      ansible.builtin.systemd:
        name: docker
      register: docker_service
      ignore_errors: true

    - name: Get Docker system disk usage
      ansible.builtin.shell: docker system df
      register: docker_system_df
      changed_when: false
      when: docker_service.status is defined and docker_service.status.ActiveState == "active"

    - name: Get detailed Docker disk usage
      ansible.builtin.shell: docker system df -v
      register: docker_system_df_v
      changed_when: false
      when: docker_service.status is defined and docker_service.status.ActiveState == "active"

    # ============================================
    # Docker Images Analysis (FIXED TAGS)
    # ============================================
    - name: List all Docker images
      ansible.builtin.shell: >
        docker images --format "{% raw %}table {{.Repository}}\t{{.Tag}}\t{{.Size}}\t{{.CreatedAt}}{% endraw %}"
      register: docker_images
      changed_when: false
      when: docker_service.status is defined and docker_service.status.ActiveState == "active"

    - name: Find dangling Docker images
      ansible.builtin.shell: docker images -f "dangling=true" -q
      register: dangling_images
      changed_when: false
      when: docker_service.status is defined and docker_service.status.ActiveState == "active"

    # ============================================
    # Docker Containers Analysis (FIXED TAGS)
    # ============================================
    - name: List all Docker containers
      ansible.builtin.shell: >
        docker ps -a --format "{% raw %}table {{.Names}}\t{{.Status}}\t{{.Size}}{% endraw %}"
      register: docker_containers
      changed_when: false
      when: docker_service.status is defined and docker_service.status.ActiveState == "active"

    # ============================================
    # Docker Build Cache Analysis (FIXED TAGS)
    # ============================================
    - name: Check Docker build cache size
      ansible.builtin.shell: >
        docker system df --format "{% raw %}{{.BuildCache}}{% endraw %}" | head -1
      register: build_cache_size
      changed_when: false
      when: docker_service.status is defined and docker_service.status.ActiveState == "active"

    # ============================================
    # Optimization Report
    # ============================================
    - name: Generate optimization report
      ansible.builtin.debug:
        msg: |
          ══════════════════════════════════════════════════════════
          🧹 DOCKER DISK OPTIMIZATION REPORT
          ══════════════════════════════════════════════════════════
          Root Usage: {{ root_usage_percent }}%
          Build Cache: {{ build_cache_size.stdout | default('N/A') }}
          
          CLEANUP SUGGESTIONS:
          - docker image prune (Safe)
          - docker system prune -a (Aggressive)
          ══════════════════════════════════════════════════════════
      when: docker_service.status is defined and docker_service.status.ActiveState == "active"
