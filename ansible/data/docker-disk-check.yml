    #   ansible.builtin.debug:
    #     msg: |
    #       Images cleaned: {{ prune_images.stdout | default('N/A') }}
    #       Containers cleaned: {{ prune_containers.stdout | default('N/A') }}
    #       Volumes cleaned: {{ prune_volumes.stdout | default('N/A') }}
    #   when: docker_service.status.ActiveState == "active"
